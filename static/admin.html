<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClubTuristic.md — Admin Database Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- LOGIN GATE MODAL -->
  <div id="loginGate" class="fixed inset-0 bg-slate-950/95 backdrop-blur z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl">
      <div class="flex items-center space-x-2.5 mb-3">
        <div class="w-8 h-8 rounded-lg bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-bold">🔐</div>
        <div>
          <h1 class="text-sm font-bold text-white">Autentificare Administrator</h1>
          <p class="text-[11px] text-slate-400">ClubTuristic.md DB Studio (SQLite Live)</p>
        </div>
      </div>

      <form onsubmit="handleAdminLogin(event)" class="space-y-3 text-xs mt-4">
        <div>
          <label class="block text-slate-400 mb-1">Utilizator</label>
          <input id="loginUser" type="text" required autocomplete="username" placeholder="admin"
                 class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Parolă</label>
          <input id="loginPass" type="password" required autocomplete="current-password"
                 class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div id="loginErr" class="hidden text-red-400 text-[11px] font-semibold"></div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl transition">
          Intră în Panou →
        </button>
      </form>
      <div class="mt-4 pt-3 border-t border-slate-800 text-center">
        <a href="/" class="text-[11px] text-slate-400 hover:text-white underline">← Înapoi la Portal Public</a>
      </div>
    </div>
  </div>

  <!-- TOP HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-30">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-bold">⚡</div>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="text-sm font-bold text-white">ClubTuristic.md <span class="text-amber-400 font-mono text-xs">Admin Studio v2</span></h1>
          <span class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-[10px] font-mono px-2 py-0.5 rounded-full">Live SQLite + FTS5</span>
        </div>
        <p class="text-[11px] text-slate-400">Orice modificare este scrisă imediat în `clubturistic.db` și indexată în căutarea publică</p>
      </div>
    </div>

    <div class="flex items-center space-x-2 text-xs">
      <a href="/" target="_blank" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700">🌐 Portal Public</a>
      <button onclick="openCreateModal()" id="addBtn" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg">+ Adaugă</button>
      <button onclick="logoutAdmin()" class="px-3 py-1.5 bg-slate-800 hover:bg-red-900/50 text-slate-300 rounded-lg border border-slate-700">Ieșire</button>
    </div>
  </header>

  <!-- TABS & SEARCH -->
  <main class="max-w-7xl w-full mx-auto px-6 py-5 flex-1">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div class="flex flex-wrap gap-2 text-xs font-bold">
        <button onclick="switchAdminTab('evenimente')" id="admTab-evenimente" class="adm-tab px-4 py-2 rounded-xl bg-amber-500 text-slate-950">
          🎉 Evenimente (<span id="admCnt-evt">0</span>)
        </button>
        <button onclick="switchAdminTab('locatii')" id="admTab-locatii" class="adm-tab px-4 py-2 rounded-xl bg-slate-800 text-slate-300 border border-slate-700">
          🍷 Crame &amp; Locații (<span id="admCnt-loc">0</span>)
        </button>
        <button onclick="switchAdminTab('propuneri')" id="admTab-propuneri" class="adm-tab px-4 py-2 rounded-xl bg-slate-800 text-slate-300 border border-slate-700">
          📬 Propuneri Comunitate (<span id="admCnt-prop">0</span>)
        </button>
      </div>

      <div class="relative w-full sm:w-80">
        <input id="adminSearch" type="text" placeholder="Caută live în SQLite (FTS5)..."
               class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-3 pr-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
      </div>
    </div>

    <!-- TABLE CONTAINER -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-x-auto shadow-lg">
      <table class="w-full text-left text-xs">
        <thead id="tableHead" class="bg-slate-800/80 text-slate-400 uppercase text-[11px]"></thead>
        <tbody id="tableBody" class="divide-y divide-slate-800"></tbody>
      </table>
    </div>
  </main>

  <!-- ADD/EDIT MODAL -->
  <div id="crudModal" class="fixed inset-0 bg-black/75 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <h2 id="crudTitle" class="text-sm font-bold text-white">Editează</h2>
        <button onclick="closeCrudModal()" class="text-slate-400 hover:text-white font-bold">✕</button>
      </div>
      <form id="crudForm" onsubmit="saveCrudForm(event)" class="space-y-3 text-xs">
        <input type="hidden" id="fMode">
        <input type="hidden" id="fId">
        <div id="crudFields" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
        <div class="pt-3 border-t border-slate-800 flex justify-end space-x-2">
          <button type="button" onclick="closeCrudModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold">Anulează</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold">Salvează în SQLite</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/admin.js"></script>
</body>
</html>
